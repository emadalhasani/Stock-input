                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">اسم المنتج</label>
                            <input type="text" id="productName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="مثال: ايفون 15 برو ماكس">

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">السعر (ريال)</label>
                                <input type="number" id="productPrice" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="0.00">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">الكمية</label>
                                <input type="number" id="productQty" required min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="1">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4 shadow-md">
                            إضافة للقائمة
                        </button>

        // تحويل النص إلى شجرة كائنات (Object Tree) لسهولة بناء القوائم المنسدلة
        function buildCategoryTree(text) {
            const tree = {};
            const lines = text.trim().split('\n');
            
            lines.forEach(line => {
                // تقسيم السطر وإزالة الفراغات الزائدة
                const parts = line.split('/').map(part => part.trim()).filter(part => part !== '');
                
                let currentNode = tree;
                // نتخطى كلمة "المنتجات" لأنها مكررة في كل الأسطر ونجعل ما بعدها هو الجذر
                for (let i = 1; i < parts.length; i++) {
                    const part = parts[i];
                if (!currentNode[part]) {
                    currentNode[part] = {};
                }
                    currentNode = currentNode[part];
                }
            });
            return tree;
        }

        // --- إعدادات وتفعيل قاعدة البيانات السحابية Firebase (Firestore) للحفظ الدائم ---
        let db, auth, currentUserId;

        async function initFirebase() {
            try {
                // نستخدم إعدادات Firebase المقدمة من البيئة السحابية
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                if (!firebaseConfig) {
                    console.warn("تنبيه: قاعدة البيانات السحابية غير مفعلة، سيتم الحفظ محلياً فقط.");
                    return;
                }

                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // تسجيل الدخول لحماية البيانات
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUserId = auth.currentUser.uid;
                
                // جلب البيانات المحفوظة مسبقاً وتحديث الجدول مباشرة (Live Sync)
                const productsRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'products');
                onSnapshot(productsRef, (snapshot) => {

                });

            } catch (error) {
                console.error("خطأ في تهيئة قاعدة البيانات:", error);
            }
        }

        const container = document.getElementById('categoryContainer');
        let selectedPath = [];

        function renderSelect(dataNode, level) {
            // إزالة أي قوائم منسدلة بعد المستوى الحالي لتحديثها
            const allSelects = container.querySelectorAll('select');
            allSelects.forEach(select => {
                if (parseInt(select.dataset.level) >= level) {
                    select.remove();
                }
            });

            // تحديث مسار الفئة المختارة
            selectedPath = selectedPath.slice(0, level);

            const keys = Object.keys(dataNode);
            if (keys.length === 0) return; // وصلنا للفرع الأخير

            // إنشاء عنصر Select جديد
            const selectEl = document.createElement('select');
            selectEl.dataset.level = level;
            selectEl.className = "w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white";
            selectEl.required = true;

            // الخيار الافتراضي
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = `اختر الفئة ${level === 0 ? 'الرئيسية' : 'الفرعية'}...`;
            defaultOption.disabled = true;
            defaultOption.selected = true;
            selectEl.appendChild(defaultOption);

            // إضافة الخيارات
            keys.forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = key;
                selectEl.appendChild(option);
            });

            // إضافة حدث التغيير
            selectEl.addEventListener('change', (e) => {
                const selectedValue = e.target.value;
                selectedPath[level] = selectedValue;
                renderSelect(dataNode[selectedValue], level + 1);
            });

            container.appendChild(selectEl);
        }

        // تهيئة القائمة الأولى عند تحميل الصفحة
        renderSelect(categoryTree, 0);

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // التحقق من اختيار الفئات
            const selects = container.querySelectorAll('select');
            const lastSelect = selects[selects.length - 1];
            
            if(selectedPath.length === 0 || !lastSelect.value) {
                alert("الرجاء إكمال اختيار الفئات حتى النهاية.");
                return;
            }

            // جمع البيانات
            const ean = document.getElementById('productEAN').value;
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value).toFixed(2);
            const qty = document.getElementById('productQty').value;
            // إضافة "المنتجات" كجذر للمسار ليطابق طلبك
            const fullPath = ['المنتجات', ...selectedPath].join(' / ');

            const product = {
                ean: ean,
                name: name,
                category: fullPath,
                price: price,
                qty: qty,
                createdAt: Date.now()
            };

            // إذا كانت قاعدة البيانات مفعلة، احفظ فيها، وإلا احفظ محلياً فقط
            if (db && currentUserId) {
                try {
                    const { collection, addDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    const productsRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'products');
                    
                    // تغيير نص الزر للإشارة للتحميل
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    const originalText = submitBtn.textContent;
                    submitBtn.textContent = "جاري الحفظ...";
                    submitBtn.disabled = true;
                    
                    await addDoc(productsRef, product);
                    
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                } catch (error) {
                    console.error("خطأ في حفظ المنتج:", error);
                    alert("حدث خطأ أثناء حفظ المنتج في السحابة.");
                }
            } else {
                 product.id = Date.now();
                 productsList.push(product);
                 updateTable();
            }

            // إعادة تفريغ الحقول باستثناء الفئة
            document.getElementById('productEAN').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productQty').value = '';
            document.getElementById('productEAN').focus();
        });

        function updateTable() {
            const tbody = document.getElementById('tableBody');
            const emptyRow = document.getElementById('emptyRow');
            const exportBtn = document.getElementById('exportBtn');
            
            if (productsList.length > 0) {
                if(emptyRow) emptyRow.style.display = 'none';
                exportBtn.disabled = false;
            } else {
                if(emptyRow) emptyRow.style.display = 'table-row';
                exportBtn.disabled = true;
            }

            // مسح الصفوف القديمة وإعادة البناء (نستثني صف الرسالة الفارغة)
            Array.from(tbody.children).forEach(child => {
                if(child.id !== 'emptyRow') {
                    child.remove();
                }
            });

            productsList.forEach(prod => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                // نستخدم dbId إذا كان متوفراً (من قاعدة البيانات) أو id العادي
                const deleteId = prod.dbId ? `'${prod.dbId}'` : prod.id;
                
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-gray-700">${prod.ean || '-'}</td>
                    <td class="px-4 py-3 font-medium text-gray-900">${prod.name}</td>
                    <td class="px-4 py-3 text-sm text-gray-500 truncate max-w-xs" title="${prod.category}">${prod.category}</td>
                    <td class="px-4 py-3 text-green-600 font-bold">${prod.price}</td>
                    <td class="px-4 py-3">${prod.qty}</td>
                    <td class="px-4 py-3">
                        <button onclick="deleteProduct(${deleteId})" class="text-red-500 hover:text-red-700 bg-red-50 px-2 py-1 rounded">حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteProduct = async function(id) {
            if (db && currentUserId && typeof id === 'string') {
                try {
                    const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'products', id);
                    await deleteDoc(docRef);
                    // الجدول سيتحدث تلقائياً بسبب onSnapshot
                } catch (error) {
                    console.error("خطأ في حذف المنتج:", error);
                }
            } else {
                // الحذف المحلي إذا لم تكن قاعدة البيانات متصلة
                productsList = productsList.filter(p => p.id !== id);
                updateTable();
            }
        }

        document.getElementById('exportBtn').addEventListener('click', function() {
            if (productsList.length === 0) return;

            // تنسيق البيانات لتناسب ملف الإكسل
            const excelData = productsList.map(prod => ({
                "رمز الصنف (EAN)": prod.ean || "",
                "اسم المنتج": prod.name,
                "الفئة (المسار الكامل)": prod.category,
                "السعر (ريال)": Number(prod.price),
                "الكمية": Number(prod.qty)
            }));

            // إنشاء ورقة العمل وملف الإكسل
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            
            // ضبط اتجاه الورقة من اليمين لليسار (RTL)
            if(!worksheet['!views']) worksheet['!views'] = [];
            worksheet['!views'].push({ rightToLeft: true });

            // ضبط عرض الأعمدة التقريبي
            worksheet['!cols'] = [
                { wch: 15 }, // رمز EAN
                { wch: 30 }, // اسم المنتج
                { wch: 60 }, // المسار
                { wch: 15 }, // السعر
                { wch: 10 }  // الكمية
            ];

            XLSX.utils.book_append_sheet(workbook, worksheet, "المنتجات");
            
            // تحديد اسم الملف وتاريخه
            const dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(workbook, `المنتجات_المدخلة_${dateStr}.xlsx`);
        });

    </script>
</body>
</html>
